spring.application.name=parcialspring

# Puerto (Railway asigna automáticamente)
server.port=${PORT:8080}

# --- ? Configuración de la base de datos ---
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- ?? Configuración de Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# --- ? Pool de conexiones ---
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}

# --- ? JWT ---
jwt.secret=${JWT_SECRET}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}
jwt.tokenPrefix=Bearer
jwt.refreshExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

# --- ?? Otras configuraciones ---
spring.main.allow-bean-definition-overriding=${ALLOW_BEAN_OVERRIDE:false}